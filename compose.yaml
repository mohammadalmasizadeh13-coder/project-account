services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Preserve the existing database path and volume when upgrading.
      DATABASE_URL: sqlite:////data/noor.db
      NOOR_UPLOAD_DIR: /data/uploads
    volumes:
      - noor-data:/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  noor-data:
